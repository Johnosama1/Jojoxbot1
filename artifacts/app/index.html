<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Jo-jokes - Lucky Wheel 🎰</title>
    <meta name="description" content="Jo-jokes — The fastest TON earning bot on Telegram. Spin the wheel and win TON daily!" />
    <!-- Open Graph / Telegram link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🎰 Jo-jokes — Lucky Wheel" />
    <meta property="og:description" content="The fastest TON earning bot on Telegram. Spin and win from 0.05 to 4 TON daily!" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🎰 Jo-jokes — Lucky Wheel" />
    <meta name="twitter:description" content="The fastest TON earning bot on Telegram. Spin and win daily!" />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" type="image/png" href="/bot-icon-circle.png" />
    <link rel="apple-touch-icon" href="/bot-icon-circle.png" />
    <link rel="preload" as="image" href="/bg.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Non-blocking font load — app renders immediately with system font fallback -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"></noscript>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Tell Telegram we're ready IMMEDIATELY so it hides the gray native loader
      // and shows our HTML splash screen instead.
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          window.Telegram.WebApp.setBackgroundColor('#020e06');
          window.Telegram.WebApp.setHeaderColor('#020e06');
        }
      } catch(e) {}
      // Disable right-click context menu and copy shortcuts
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      document.addEventListener('copy', function(e) { e.preventDefault(); });
      document.addEventListener('cut', function(e) { e.preventDefault(); });
      document.addEventListener('selectstart', function(e) { e.preventDefault(); });
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        overflow: hidden;
        background-color: #030410;
        background-image: url('/bg.jpg');
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
        font-family: 'Cairo', sans-serif;
      }
      #root { height: 100%; position: relative; z-index: 1; }

      /* ── Splash Screen ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background-image:
          linear-gradient(180deg, rgba(3,4,16,0.1) 0%, rgba(3,4,16,0.3) 60%, rgba(3,4,16,0.7) 100%),
          linear-gradient(to right, rgba(3,4,16,0.4) 0%, rgba(3,4,16,0.0) 25%, rgba(3,4,16,0.0) 75%, rgba(3,4,16,0.4) 100%),
          url('/bg.jpg');
        background-size: cover;
        background-position: center top;
        background-color: #030410;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-logo-img {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        animation: splash-float 2.4s ease-in-out infinite;
        box-shadow: 0 0 0 4px rgba(251,191,36,0.35), 0 0 40px rgba(251,191,36,0.45), 0 0 70px rgba(139,92,246,0.25);
      }

      .splash-dots {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .splash-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(251,191,36,0.85);
        box-shadow: 0 0 8px rgba(251,191,36,0.6);
        animation: splash-bounce 1.1s ease-in-out infinite;
      }
      .splash-dot:nth-child(2) { animation-delay: 0.18s; background: rgba(139,92,246,0.85); box-shadow: 0 0 8px rgba(139,92,246,0.6); }
      .splash-dot:nth-child(3) { animation-delay: 0.36s; }

      @keyframes splash-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes splash-bounce {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
        40% { transform: scale(1.2); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Splash shown immediately before JS loads -->
    <div id="splash">
      <img
        class="splash-logo-img"
        src="/app/bot-icon-circle.png"
        alt="Jo-jokes"
      />
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
